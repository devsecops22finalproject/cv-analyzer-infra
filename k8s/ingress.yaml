apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: screener
  namespace: job-screener
spec:
  rules:
    - host: screener.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
