apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: job-screener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: eliaor360/cv-analyzer-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:$(POSTGRES_PASSWORD)@postgres:5432/screener
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: postgres-password
            - name: MUSE_SPARK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: muse-spark-key
            - name: MUSE_SPARK_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: muse-spark-base-url
          envFrom:
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
